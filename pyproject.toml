[project]
name = "insurebot"
version = "0.1.0"
description = "Production-grade insurance assistant chatbot (policy and product assistants)."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "sqlalchemy==2.1.9",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "redis==5.3.1",
    "httpx==0.28.1",
    "tenacity==9.2.1",
    "autogen-agentchat==0.7.5",
    "autogen-ext[openai]==0.7.5",
    "structlog==26.1.0",
    "arq==0.28.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "testcontainers==4.15.0",
    "ruff==0.17.6",
    "mypy==2.4.1",
    "pre-commit==4.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "C4", "SIM", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs Docker (testcontainers)",
    "evals: conversation eval suite",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
